<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Splash White Water Rafting</title>
    <meta name="description"
        content="Contact Splash White Water Rafting. Get in touch with our team for trip reservations, general inquiries, address, phone number, email, and employee information.">
    <meta name="author" content="Arthur Abreu">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Splash White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="company-info-header">
            <h1>Splash White Water Rafting</h1>
            <p class="company-address">123 Main River Street<br>Kolob, California</p>
            <p class="company-phone">+1 999 999 9999</p>
            <p class="company-email"><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </div>

        <section class="contact-section">
            <h2 class="sr-only">Location and Contact Form</h2>
            <div class="contact-grid">
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d-122.41941548468083!3d37.77492957975924!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064cb900000%3A0x1111111111111111!2sWhite%20Water%20Rafting!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus"
                        width="400" height="380" title="Splash White Water Rafting Location Map" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

                <form action="#" method="post" class="contact-form">
                    <div class="form-item">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" placeholder="Placeholder" required>
                    </div>

                    <div class="form-item">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" placeholder="Placeholder" required>
                    </div>

                    <fieldset class="purpose-fieldset">
                        <legend>Message Purpose</legend>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" id="general" name="purpose" value="general" checked>
                                General Inquiry
                            </label>
                            <label class="radio-label">
                                <input type="radio" id="reservation" name="purpose" value="reservation">
                                Reservation Question
                            </label>
                            <label class="radio-label">
                                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit" class="submit-button">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employees-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="John Doe - General Manager">
                    <figcaption>
                        <strong>John Doe</strong>
                        <span>General Manager</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Jane Smith - Lead River Guide">
                    <figcaption>
                        <strong>Jane Smith</strong>
                        <span>Lead River Guide</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Alex Johnson - Safety &amp; Operations Director">
                    <figcaption>
                        <strong>Alex Johnson</strong>
                        <span>Safety &amp; Operations Director</span>
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&#169; 2026 Splash | White Water Rafting | Arthur Abreu</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Visit our Facebook page">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.svg" alt="Visit our LinkedIn page">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Visit our Instagram page">
            </a>
        </nav>
    </footer>

</body>

</html>
